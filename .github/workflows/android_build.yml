name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Compilar APK con Gradle y JDK 17
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código fuente (Checkout)
        uses: actions/checkout@v4

      - name: 2. Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Generar Keystore de Release (Firma V1 + V2 + V3)
        run: |
          if [ ! -f app/release-key.jks ]; then
            keytool -genkeypair -v \
              -keystore app/release-key.jks \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias calculadorturnos \
              -storepass "Calculador2026!" \
              -keypass "Calculador2026!" \
              -dname "CN=Calculador de Turnos, OU=Mobile, O=Antigravity, L=BuenosAires, S=BA, C=AR"
          fi

      - name: 4. Configurar caché de Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 5. Conceder permisos de ejecución a gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: 6. Compilar APK firmada en modo Release
        run: ./gradlew assembleRelease --no-daemon

      - name: 7. Preparar archivo APK final
        run: |
          cp app/build/outputs/apk/release/app-release.apk CalculadorTurnos.apk

      - name: 8. Subir APK como Artifact de GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: CalculadorTurnos-Android-APK
          path: CalculadorTurnos.apk
          retention-days: 30
