name: CalculadorTurnos
options:
  bundleIdPrefix: com.antigravity
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

targets:
  CalculadorTurnos:
    type: application
    platform: iOS
    sources:
      - path: CalculadorTurnos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antigravity.calculadorturnos
        PRODUCT_NAME: CalculadorTurnos
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Calculador de Turnos"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
    scheme:
      testTargets: []
      gatherCoverageData: false
