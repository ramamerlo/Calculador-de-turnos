name: CalculadorTurnos
options:
  bundleIdPrefix: com.antigravity
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

targets:
  CalculadorTurnos:
    type: application
    platform: iOS
    sources:
      - path: CalculadorTurnos
        excludes:
          - Info.plist
    info:
      path: CalculadorTurnos/Info.plist
      properties:
        CFBundleDisplayName: "Calculador de Turnos"
        CFBundleName: "Calculador de Turnos"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antigravity.calculadorturnos
        PRODUCT_NAME: CalculadorTurnos
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CalculadorTurnos/Info.plist
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
    scheme:
      testTargets: []
      gatherCoverageData: false
